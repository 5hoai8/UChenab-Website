name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /UChenab-Website
    steps:
      - name: Check out original design
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Preserve original export
        run: mv out site-export
      - name: Check out academy-style alternative
        uses: actions/checkout@v4
        with:
          ref: design/academy-style
          path: academy-source
      - name: Install alternative dependencies
        working-directory: academy-source
        run: npm ci
      - name: Verify and build alternative
        working-directory: academy-source
        env:
          NEXT_PUBLIC_BASE_PATH: /UChenab-Website/academy-style
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm test
      - name: Combine both websites
        run: |
          mv academy-source/out site-export/academy-style
          touch site-export/.nojekyll
          test -f site-export/index.html
          test -f site-export/academy-style/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-export
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both designs
        id: deployment
        uses: actions/deploy-pages@v4
